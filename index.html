<title>Terraform Architects</title>

<style>

:root[data-theme="dark"]{--bg:#0b1020;--fg:#e8ecf7;--mut:#9aa6c4;--nav:#1b2a52;--surf:#151d36;--soft:#1d2746;--line:#2a3558;--acc:#5b8def;--red:#ef5350;--ok:#66bb6a;--shadow:0 2px 12px #0006;--logo-filter:invert(1);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
header{background:linear-gradient(135deg,var(--nav),var(--acc));color:#fff;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-radius:0 0 20px 20px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:block;height:34px;width:auto;max-width:100%;filter:invert(1)}
.logo.big{height:auto;width:min(100%,300px);margin:0 auto 6px;filter:var(--logo-filter)}
.appname{font-size:13px;line-height:1.2;opacity:.9;padding-left:12px;border-left:1px solid #ffffff66}
#who{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.hbtn{background:#ffffff26;color:#fff;border:0;border-radius:999px;padding:0 16px;min-height:40px;font:inherit;font-size:13px;cursor:pointer}
.hbtn:hover{background:#ffffff40}
#bar{position:sticky;top:0;z-index:5;background:var(--bg);max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
#bar:empty{display:none}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;min-width:0;font-size:14px}
.crumb{background:none;border:0;padding:6px 2px;min-height:36px;color:var(--acc);font:inherit;cursor:pointer;text-align:left}
.crumb:hover{text-decoration:underline}
.cur{padding:6px 2px;color:var(--mut);font-weight:600}
.sep{padding:0 6px;color:var(--mut)}
main{max-width:1200px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h2{font-size:22px;margin:8px 0 6px;line-height:1.25}
h3{font-size:16px;margin:22px 0 10px}
p{margin:0 0 10px}
.lead{margin:0 0 14px}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.grid>*,form>*{min-width:0}
.card{background:var(--surf);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px}
.card .n{font-size:26px;font-weight:700;color:var(--acc);line-height:1.2}
.card .n.red{color:var(--red)}.card .n.ok{color:var(--ok)}
.nav-card{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;position:relative;padding-right:40px;min-height:64px;justify-content:center}
.nav-card b{font-size:16px}
.nav-card::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;border-top:2px solid var(--mut);border-right:2px solid var(--mut);transform:translateY(-50%) rotate(45deg)}
.nav-card:hover{background:var(--soft)}
.nav-card:active{transform:scale(.98)}
.wrap{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--soft);color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:10px;text-align:left}
td{padding:10px;background:var(--surf);border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
tr:hover td{background:var(--soft)}
.red{color:var(--red);font-weight:700}.ok{color:var(--ok);font-weight:700}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.card form{background:none;border:0;box-shadow:none;padding:0;margin:0}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
input,select{font:inherit;font-size:16px;width:100%;min-width:0;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--fg)}
td input,td select{min-height:38px;font-size:14px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit}
button.p{width:100%;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;transition:transform .1s,filter .1s}
button.p:hover{filter:brightness(1.08)}button.p:active{transform:scale(.97)}
.btn,td button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surf);color:var(--fg);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover,td button:hover{background:var(--soft)}
label.btn{margin:0;color:var(--fg);font-size:13px}
.back{min-height:40px;padding:0 16px 0 12px;gap:8px;background:var(--surf);box-shadow:var(--shadow);font-size:14px}
.back::before{content:"";width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:4px}
.note{background:var(--soft);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;font-size:13px;margin:14px 0}
.pie{width:150px;height:150px;border-radius:50%;flex:none}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:600;line-height:1.6}
.bar{height:8px;min-width:80px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.over i{background:var(--red)}
.bars{display:grid;gap:12px}
.brow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 64px;gap:10px;align-items:center}
.brow .bl{font-size:13px}
.brow .bv{text-align:right;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.bars .bar{height:12px}
@media(max-width:560px){.brow{grid-template-columns:minmax(0,1fr) auto}.brow .bar{grid-column:1/-1;order:3}}
.pcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pcell .bar{flex:1 1 80px;max-width:140px}
a{color:var(--acc)}
.login{max-width:380px;margin:30px auto}
.login form{grid-template-columns:1fr;border:0;box-shadow:none;padding:0;margin:0}
.ov{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:99;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov .ovbar{align-self:flex-start}
.ov img{max-width:100%;max-height:80vh;max-height:80dvh;object-fit:contain}
main>*{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){main>*{animation:none}*{transition:none!important}}
@media(max-width:700px){
  h2{font-size:20px}
  .wrap{overflow:visible;background:none;border:0;box-shadow:none}
  table.rt,.rt tbody,.rt tr,.rt td{display:block;width:100%;min-width:0}
  .rt tr.hd{display:none}
  .rt tr{background:var(--surf);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px 0;margin-bottom:10px}
  .rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:7px 14px;text-align:right;background:none}
  .rt tr:hover td{background:none}
  .rt td[data-label]:not([data-label=""])::before{content:attr(data-label);color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px;text-align:left;flex:none;max-width:45%}
  .rt td[data-label=""]{justify-content:flex-end;flex-wrap:wrap}
  .rt td[colspan]{display:block;text-align:left}
  .rt td:empty{display:none}
  .rt td .av{flex:1 1 55%;min-width:0;text-align:right}
  .rt td input,.rt td select{width:55%;flex:1 1 55%}
}
@media(max-width:420px){.appname{display:none}}
@media(max-width:480px){
  .logo{height:28px}
  .card{padding:14px}
  .card .n{font-size:22px}
  .pie{width:130px;height:130px}
}

/* ---- Version 6 look: friendlier, softer, easier to tap ---- */
:root{--bg:#f2f5fb;--fg:#0f1b36;--mut:#5f6c8a;--nav:#10224a;--soft:#eaf0fb;--line:#dde4f2;--acc:#2563eb;--r:18px;--shadow:0 1px 2px #0f1b3612,0 10px 26px -10px #0f1b3633}
body{font-size:16px;line-height:1.55}
h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
h3{font-size:17px;font-weight:700;margin:28px 0 12px}
header{background:linear-gradient(120deg,var(--nav) 0%,#1e40af 62%,var(--acc) 100%);border-radius:0 0 28px 28px;padding-bottom:16px}
#who{gap:10px}
.ava{width:38px;height:38px;border-radius:50%;background:#ffffff30;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;flex:none}
.wn{display:flex;flex-direction:column;line-height:1.15;font-weight:600;font-size:14px}
.wn small{font-weight:500;opacity:.78;font-size:12px;text-transform:capitalize}
.hbtn{min-height:42px;padding:0 18px;font-weight:600}
@media(max-width:380px){.wn{display:none}}
#bar{background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card{border-radius:var(--r);padding:18px}
.card .n{font-size:28px;font-weight:800;letter-spacing:-.02em}
.card .mut{line-height:1.4}
.nav-card{padding:16px 44px 16px 16px;gap:2px;min-height:78px;transition:transform .12s,box-shadow .12s,background .12s}
.nav-card:hover{box-shadow:0 12px 30px -12px #2563eb55}
.nav-card:has(.ic){justify-content:flex-start}
.nav-card .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;font-style:normal;margin-bottom:10px}
.grid{gap:14px}
.wrap{border-radius:var(--r)}
th{font-size:13px;font-weight:700;text-transform:none;letter-spacing:.01em;padding:12px 14px}
td{padding:12px 14px}
label{font-size:13px;font-weight:600;margin-bottom:5px}
input,select{min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;transition:border-color .12s,box-shadow .12s}
td input,td select{min-height:42px;border-radius:10px}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
form{gap:14px;padding:18px;border-radius:var(--r)}
button.p{min-height:50px;border-radius:12px;font-size:16px;background:linear-gradient(135deg,var(--acc),#1d4ed8);box-shadow:0 8px 18px -8px color-mix(in srgb,var(--acc) 80%,transparent)}
.btn,td button{min-height:42px}
.note{border-radius:14px;padding:14px 16px}
.bar{height:10px}
.login{max-width:430px;margin:22px auto;padding:28px 22px}
.login h2{font-size:24px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--soft);border-radius:14px}
.seg input{position:absolute;opacity:0;pointer-events:none;min-height:0}
.seg label{margin:0;padding:12px 8px;text-align:center;border-radius:10px;font-size:15px;font-weight:700;color:var(--mut);cursor:pointer;transition:background .12s,color .12s}
.seg input:checked+label{background:var(--surf);color:var(--fg);box-shadow:var(--shadow)}
.seg input:focus-visible+label{outline:2px solid var(--acc);outline-offset:1px}
@keyframes in{from{opacity:0}}
main>*{animation:in .18s ease}
@media(max-width:560px){
  h2{font-size:23px}
  .grid:not(:has(.nav-card)){grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid:not(:has(.nav-card)) .card{padding:14px}
  .card .n{font-size:21px}
}
@media(min-width:900px){main{padding-top:10px}.grid{gap:18px}}

const SECS={
 cs:['Construction (Staff)','s','Overview, expenses, materials cost, attendance and payroll, disbursement, suppliers, tools, stocks, requests and tasks.',['ov','ex','mat','py','dis','del','sp','tools','stk','po','req','tk','wk']],
 ca:['Construction (Admin)','a','Summary, project details, budget consumption, income, billing, subcontractors and additional works.',['sum','pd','cv','bu','inc','bill','inv','sub','vo']],

Object.assign(PD,{dpr:'What was done on site each day, with photos.',bj:'Work to redo or correct, with status and cost.',pm:'Building permit, Meralco, water, occupancy and final electrical inspection per city hall.',tax:'Real property tax with paid and unpaid pie charts.',stu:'Design studies requested by clients, with due dates and status.'});
SECS.cs[2]='Overview, daily site progress, back jobs, permits, expenses, materials cost, attendance and payroll, disbursement, suppliers, tools, stocks, requests and tasks.';
SECS.cs[3]=['ov','dpr','bj','pm','ex','mat','py','dis','del','sp','tools','stk','po','req','tk','wk'];
SECS.ca[2]='Summary, project details, budget consumption, income, billing, subcontractors, additional works and amilyar.';
SECS.ca[3].push('tax');
SECS.ds[2]='Project leads, studies, list of ongoing design projects and project pages.';
SECS.ds[3].push('stu');
const secOf=t=>Object.keys(SECS).find(k=>SECS[k][3].includes(t));
const canSec=k=>SECS[k][1]=='s'||S.role=='admin';
const ok=t=>t=='home'||(SECS[t]?canSec(t):!!(L[t]&&secOf(t)&&canSec(secOf(t))));

/* Navigation: every page has a Back button. It uses the browser history when there is one, otherwise goes to the parent page. */
const hs=()=>{try{return history.state}catch(e){return null}};
function nav(t,dp){const n=((hs()&&hs().n)||0)+1;S.tab=t;S.dp=dp==null?-1:dp;save();try{history.pushState({t:S.tab,dp:S.dp,n},'')}catch(e){}draw();window.scrollTo(0,0)}
function parentOf(){if(S.tab=='ong'&&S.dp>=0)return['ong',-1];if(SECS[S.tab])return['home',-1];return[secOf(S.tab)||'home',-1]}
function back(){const h=hs();if(h&&h.n>0){try{history.back();return}catch(e){}}const p=parentOf();S.tab=p[0];S.dp=p[1];save();draw();window.scrollTo(0,0)}
addEventListener('popstate',e=>{if(!S.me)return;const s=e.state;if(s&&s.t&&ok(s.t)){S.tab=s.t;S.dp=s.dp==null?-1:s.dp}else{S.tab='home';S.dp=-1}save();draw()});
function bar(){
  if(S.tab=='home')return'';
  const sp='<span class="sep">/</span>';
  let c='<button type="button" class="btn back" onclick="back()">Back</button><div class="crumbs"><button type="button" class="crumb" onclick="nav(\'home\')">Home</button>'+sp;
  if(SECS[S.tab])c+=`<span class="cur">${SECS[S.tab][0]}</span>`;
  else{const s=secOf(S.tab);c+=`<button type="button" class="crumb" onclick="nav('${s}')">${SECS[s][0]}</button>${sp}`;
    if(S.tab=='ong'&&S.dp>=0&&S.dt[S.dp])c+=`<button type="button" class="crumb" onclick="nav('ong')">${L.ong}</button>${sp}<span class="cur">${esc(S.dt[S.dp].n)}</span>`;
    else c+=`<span class="cur">${L[S.tab]}</span>`}
  return c+'</div>'}
function secView(k){const s=SECS[k];return `<h2>${s[0]}</h2><p class="mut lead">${s[2]}</p><div class="grid">${s[3].map(p=>`<button type="button" class="card nav-card" onclick="nav('${p}')"><b>${L[p]}</b><span class="mut">${PD[p]}</span></button>`).join('')}</div>`}

/* On narrow screens every table turns into stacked cards; labels come from the header row. */
function mkRT(){document.querySelectorAll('#m table').forEach(t=>{t.classList.add('rt');const rows=[...t.querySelectorAll('tr')],h=rows[0];if(!h||!h.querySelector('th'))return;const hl=[...h.children].map(c=>c.textContent.trim());h.classList.add('hd');rows.slice(1).forEach(r=>{let i=0;[...r.children].forEach(c=>{c.setAttribute('data-label',c.colSpan>1?'':(hl[i]||''));i+=c.colSpan||1})})})}

const pex=()=>S.ex.filter(e=>e.p==S.proj);
const sum=a=>tot(a);
const pk=k=>S[k].filter(x=>x.p==S.proj);
const sel=()=>`<div class="card" style="margin-bottom:12px"><label for="projsel">Project</label><select id="projsel" onchange="S.proj=+this.value;save();draw()">${opt(P,S.proj)}</select></div>`;
let FID=0;
function draw(){
  const u=S.users.find(x=>x.name==S.me);
  if(!u){S.me=null;return loginView()}
  S.role=u.role;FID=0;
  document.getElementById('who').innerHTML=`<span class="ava">${esc(u.name.slice(0,1).toUpperCase())}</span><span class="wn">${esc(u.name)}<small>${u.role}</small></span><button type="button" class="hbtn" onclick="logout()">Sign out</button>`;
  if(!ok(S.tab)){S.tab='home';S.dp=-1}
  document.getElementById('bar').innerHTML=bar();
  document.getElementById('m').innerHTML=SECS[S.tab]?secView(S.tab):V[S.tab]();
  const fl=(id,arr)=>{const e=document.getElementById(id);if(e)e.innerHTML=[...new Set(arr.filter(Boolean))].map(v=>`<option value="${esc(v)}"></option>`).join('')};
  fl('suplist',S.sl.map(x=>x.name));fl('dnlist',S.dt.map(p=>p.n).concat(S.leads.map(l=>l.n)));fl('lgulist',Object.values(S.lgu));
  mkRT();
}

/* Labor, income and budget numbers used by several pages */
const otr=w=>(+w.ot)||((+w.rate||0)/8*1.25);
const attPay=a=>{const w=S.wr[a.w];return w?(+a.d||0)*(+w.rate||0)+(+a.oh||0)*otr(w):0};
const laborAtt=p=>S.at.filter(a=>a.p==p).reduce((t,a)=>t+attPay(a),0);
function fin(p){
  const sc=s=>S.sc[p+'|'+s]||{c:0,e:0};let contract=0,budget=0;
  SC.forEach(s=>{contract+=+sc(s).c||0;budget+=+sc(s).e||0});
  const aw=tot(S.vo.filter(v=>v.p==p),'price'),exp=tot(S.ex.filter(e=>e.p==p)),lab=laborAtt(p),sb=tot(S.sb.filter(b=>b.p==p));
  const inc=tot(S.inc.filter(i=>i.p==p)),billed=S.bill.filter(b=>b.p==p).reduce((t,b)=>t+(+sc(b.s).c||0)*b.pct/100,0),inv=tot(S.iv.filter(i=>i.p==p));
  const value=contract+aw,cost=exp+lab+sb;
  return{contract,budget,aw,value,exp,lab,sb,cost,inc,billed,inv,remBudget:budget-cost,remBal:value-inc}}
const cd=(n,l,c='')=>`<div class="card"><div class="n ${c}">${n}</div><div class="mut">${l}</div></div>`;
const SITEC=['#1f5fe0','#2e7d32','#b26a00','#7b1fa2'];
const chip=i=>`<span class="chip" style="background:${SITEC[(+i||0)%SITEC.length]}">${esc(P[i]||'Unassigned')}</span>`;

function addEx(f){const d=new FormData(f);S.ex.push({p:S.proj,date:d.get('date'),sc:d.get('sc'),ct:d.get('ct'),sup:d.get('sup'),desc:d.get('desc'),qty:d.get('qty'),unit:d.get('unit'),amt:+d.get('amt'),sf:d.get('sf'),rec:d.get('rec'),rno:d.get('rno'),type:d.get('type'),vo:d.get('vo')});save();draw();return false}
function delEx(i){if(confirm('Delete this expense?')){S.ex.splice(i,1);save();draw()}}
function pie(m){const t=Object.values(m).reduce((a,b)=>a+b,0);if(!t)return '<p class="mut">No data yet.</p>';
  const cols=['#14213d','#2f5fb3','#5b8def','#9db8f0','#2e7d32','#f9a825','#c62828','#6d4c41','#00838f','#7b1fa2'];let a=0,g=[],l=[];
  Object.entries(m).forEach(([k,v],i)=>{const c=cols[i%cols.length],p=v/t*100;g.push(`${c} ${a}% ${a+p}%`);a+=p;l.push(`<div><span style="display:inline-block;width:10px;height:10px;background:${c};border-radius:2px"></span> ${esc(k)} - ${p.toFixed(1)}%</div>`)});
  return `<div class="row"><div class="pie" style="background:conic-gradient(${g.join(',')})"></div><div class="mut">${l.join('')}</div></div>`}
function wkRange(d){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()-x.getDay());const y=new Date(x);y.setDate(y.getDate()+6);const f=z=>new Date(z-z.getTimezoneOffset()*60000).toISOString().slice(0,10);return[f(x),f(y)]}
let WD=today(),PW=today(),BP='month';
const fld=([l,n,t='text',o,x=''])=>{const id='f'+(++FID),req=(t=='num0'||t=='opt'||t=='dopt')?'':'required',ty=t=='num0'?'number':t=='opt'?'text':t=='dopt'?'date':t;return `<div><label for="${id}">${l}</label>${t=='sel'?`<select id="${id}" name="${n}">${opt(o)}</select>`:`<input id="${id}" name="${n}" type="${ty}" ${t=='number'||t=='num0'?'step="any" inputmode="decimal"':''} ${req} ${t=='date'?`value="${today()}"`:''} ${x}>`}</div>`};
const frm=(k,fs,btn='Add')=>`<form onsubmit="return add('${k}',this)">${fs.map(fld).join('')}<div><label>&nbsp;</label><button class="p">${btn}</button></div></form>`;
const tbl=(h,r)=>`<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')||`<tr><td colspan="${h.length}" class="mut">Nothing yet.</td></tr>`}</table></div>`;
const AM={1:'Present',0.5:'Half day',0:'Absent'};
const IC={cs:['🏗️','#fff1d6'],ca:['📊','#dcfce7'],ds:['✏️','#e0ecff'],da:['💼','#ede9fe'],ad:['⚙️','#e8eaf0']};
const V={
home(){const od=S.dt.reduce((n,p)=>n+p.sc.filter(s=>s.st!='Done'&&s.tg&&s.tg<today()).length,0);
  const aw=S.leads.filter(l=>l.res=='Awaiting Reply').length,pend=S.rq.filter(r=>r.status=='Pending').length;
  const cards=Object.keys(SECS).filter(canSec).map(k=>`<button type="button" class="card nav-card" onclick="nav('${k}')"><i class="ic" style="background:${IC[k][1]}">${IC[k][0]}</i><b>${SECS[k][0]}</b><span class="mut">${SECS[k][2]}</span></button>`).join('');
  return `<h2>Hello, ${esc(S.me)}</h2><p class="mut lead">Here is where things stand today.</p><div class="grid">${cd(S.dt.filter(p=>p.sc.some(s=>s.st!='Done')).length,'Ongoing design projects')}${cd(od,'Overdue scopes',od?'red':'')}${cd(pend,'Requests waiting for approval')}${cd(aw,'Leads awaiting reply')}</div>

ov(){const f=fin(S.proj),t=today(),m={};
  pex().forEach(e=>m[e.sc]=(m[e.sc]||0)+(+e.amt||0));
  const open=S.tk.filter(x=>x.p==S.proj&&x.st!='Done').length,pend=S.rq.filter(x=>x.p==S.proj&&x.status=='Pending').length,tl=S.tool.filter(x=>x.site==S.proj).length,present=S.at.filter(a=>a.p==S.proj&&a.date==t&&a.d>0).length,dl=S.dis.filter(x=>x.p==S.proj).length;
  const last=pex().slice(-5).reverse(),adm=S.role=='admin',obj=S.bj.filter(x=>x.p==S.proj&&x.st!='Done').length,pm2=S.pm.filter(x=>x.p==S.proj),pmd=pm2.filter(x=>isDone(x.st)).length,lastp=(S.dprog.filter(x=>x.p==S.proj).map(x=>x.date).sort().pop())||'-';

  ${adm?`<h3>Budget and income</h3><div class="grid">${cd(f.budget?pc(f.cost,f.budget):'-','Budget used')}${cd($(f.remBudget),'Remaining budget',f.remBudget<0?'red':'')}${cd($(f.inc),'Gross income collected')}${cd($(f.remBal),'Remaining balance to collect')}</div>`:''}
  <h3>Materials cost by tag</h3><div class="card" style="margin-bottom:12px">${pie(m)}</div>
  <h3>Latest expenses</h3>${tbl(['Date','Tag','Description','Amount'],last.map(e=>`<tr><td>${e.date}</td><td>${esc(e.sc)}</td><td>${esc(e.desc)}</td><td class="r">${$(e.amt)}</td></tr>`))}`},
ex(){const L2=pex();const gr=expGraph(L2);return `<h2>Expenses</h2>${sel()}<p class="mut">Pick a tag for each receipt. The tag decides which slice of the Materials Cost pie it goes to.</p><form onsubmit="return addEx(this)">

  <div><label>&nbsp;</label><button class="p">Add</button></div></form>${gr}

  ${L2.map(e=>{const i=S.ex.indexOf(e);return `<tr><td>${e.date}</td><td>${esc(e.sc)}</td><td>${esc(e.ct)}</td><td>${esc(e.sup)}</td><td>${esc(e.desc)}</td><td>${e.sf}</td><td>${esc(e.rec)}</td><td>${e.type=='Variation Order'?'VO':''}</td><td class="r">${$(e.amt)}</td><td>${e.img?`<button type="button" onclick="viewR(${i})">View receipt</button> `:''}<label class="btn">${e.img?'Replace':'Add receipt'}<input type="file" accept="image/*" capture="environment" hidden onchange="attach(${i},this)"></label> <button type="button" onclick="delEx(${i})">Delete</button></td></tr>`}).join('')||'<tr><td colspan="10" class="mut">No expenses yet.</td></tr>'}
  <tr><td colspan="8"><b>Total</b></td><td class="r"><b>${$(sum(L2))}</b></td><td></td></tr></table></div>`},

mat(){const m={},c={};pex().forEach(e=>{m[e.sc]=(m[e.sc]||0)+(+e.amt||0);c[e.ct]=(c[e.ct]||0)+(+e.amt||0)});const T=Object.values(m).reduce((a,b)=>a+b,0);

  <h3>Payroll for the week</h3><div class="card" style="margin-bottom:12px"><label for="pwd">Pick any date in the week (Sun-Sat)</label><input id="pwd" type="date" value="${PW}" onchange="PW=this.value;draw()"><p class="mut" style="margin:8px 0 0">${a} to ${b}</p></div>

del(){const r=pk('dl').map(x=>{const q=x.mat=='CHB (pcs)'?+x.n:(+x.l)*(+x.w)*(+x.h)*(+x.n||1),ex=q*x.price,bad=Math.abs(ex-x.paid)>1;return`<tr><td>${x.date}</td><td>${x.mat}</td><td>${esc(x.sup)}</td><td class="r">${q.toFixed(2)}</td><td class="r">${$(ex)}</td><td class="r ${bad?'red':''}">${$(x.paid)}${bad?' (mismatch)':''}</td></tr>`});

tools(){const rows=S.tool.map((t,i)=>`<tr><td>${esc(t.name)}</td><td>${chip(t.site)}</td><td class="${t.cond=='Good'?'':'red'}">${t.cond}</td><td>${esc(t.holder)}</td><td><select aria-label="Move ${esc(t.name)} to" onchange="moveTool(${i},this.value)"><option value="">Move to...</option>${P.map((n,j)=>j==t.site?'':`<option value="${j}">${esc(n)}</option>`).join('')}</select></td></tr>`);

req(){return `<h2>Staff Requests</h2>${sel()}${frm('rq',[['Date','date','date'],['Type','kind','sel',['Purchase Request','Petty Cash']],['Description','desc'],['Amount','amt','number'],['Requested by','by']])}${tbl(['Date','Type','Description','By','Amount','Status'],pk('rq').map(x=>`<tr><td>${x.date}</td><td>${x.kind}</td><td>${esc(x.desc)}</td><td>${esc(x.by)}</td><td class="r">${$(x.amt)}</td><td>${x.status=='Pending'?(S.role=='admin'?`<button type="button" onclick="approve(${S.rq.indexOf(x)})">Approve</button>`:'Pending'):'<span class="ok">Approved</span>'}</td></tr>`))}<p class="mut">Admin approval posts the request to Expenses.</p>`},
tk(){const m={};pk('tk').forEach(x=>{m[x.who]=m[x.who]||[0,0];m[x.who][1]++;if(x.st=='Done')m[x.who][0]++});

sum(){if(S.role!='admin')return'';const f=fin(S.proj);
  const rows=[['Contract amount',f.contract],['Additional works',f.aw],['Total contract value',f.value],['Budget (estimates)',f.budget],['Materials and overhead (Expenses)',f.exp],['Labor (Attendance & Payroll)',f.lab],['Subcontractor billings',f.sb],['Total cost to date',f.cost],['Gross income collected',f.inc],['Billed to client (progress billing, gross)',f.billed],['Invoiced to client',f.inv]];
  return `<h2>Summary</h2>${sel()}<div class="grid">${cd($(f.inc),'Gross income')}${cd($(f.remBudget),'Remaining budget',f.remBudget<0?'red':'')}${cd($(f.remBal),'Remaining balance')}${cd($(f.billed),'Billings')}</div>

pd(){if(S.role!='admin')return'';let tc=0,tw=0,tcost=0,tin=0;
  const r=P.map((n,i)=>{const f=fin(i);tc+=f.contract;tw+=f.aw;tcost+=f.cost;tin+=f.inc;return `<tr><td><a href="#" onclick="S.proj=${i};nav('sum');return false">${esc(n)}</a></td><td class="r">${$(f.contract)}</td><td class="r">${$(f.aw)}</td><td class="r">${$(f.value)}</td><td class="r">${$(f.cost)}</td><td class="r">${$(f.inc)}</td></tr>`});

  return `<h2>Project Details</h2><p class="mut">All construction projects with their contract and total cost. Total cost is expenses plus labor payroll plus subcontractor billings. Select a project name to open its summary.</p>${tbl(['Project','Contract','Additional works','Total contract value','Total cost to date','Income collected'],r)}`},
cv(){if(S.role!='admin')return'';const k=s=>S.proj+'|'+s;const c=s=>S.sc[k(s)]||{c:0,e:0};const L2=pex();let tc=0,te=0,ta=0;
  const rows=SC.map(s=>{const a=sum(L2.filter(e=>e.sc==s)),d=c(s);tc+=+d.c;te+=+d.e;ta+=a;const v=d.e-a;
   return `<tr><td>${esc(s)}</td><td><input type="number" inputmode="decimal" aria-label="Contract for ${esc(s)}" value="${d.c}" onchange="setSc('${s}','c',this.value)"></td><td><input type="number" inputmode="decimal" aria-label="Estimate for ${esc(s)}" value="${d.e}" onchange="setSc('${s}','e',this.value)"></td><td class="r">${$(a)}</td><td class="r ${v<0?'red':'ok'}">${$(v)}${v<0?' (over estimate)':''}</td></tr>`}).join('');
  const vo=sum(L2.filter(e=>e.type=='Variation Order')),m={};SC.forEach(s=>{const a=sum(L2.filter(e=>e.sc==s));if(a)m[s]=a});
  return `<h2>Contract, Estimate & Cost Variance</h2>${sel()}<div class="wrap"><table><tr><th>Tag</th><th>Contract (PHP)</th><th>Estimate (PHP)</th><th class="r">Actual</th><th class="r">Variance</th></tr>${rows}<tr><td><b>Total</b></td><td class="r">${$(tc)}</td><td class="r">${$(te)}</td><td class="r">${$(ta)}</td><td class="r ${te-ta<0?'red':''}">${$(te-ta)}</td></tr></table></div><p class="mut">Expenses tagged as Variation Order: ${$(vo)}</p><h3>% of cost per tag</h3><div class="card">${pie(m)}</div>`},
bu(){if(S.role!='admin')return'';const f=fin(S.proj);
  const key=d=>BP=='week'?wkRange(d)[0]:BP=='year'?d.slice(0,4):d.slice(0,7);const m={},g=k=>m[k]=m[k]||{m:0,l:0,s:0};
  pex().forEach(e=>{const r=g(key(e.date));if(e.ct=='Labor')r.l+=+e.amt||0;else r.m+=+e.amt||0});
  S.at.filter(a=>a.p==S.proj).forEach(a=>{g(key(a.date)).l+=attPay(a)});
  S.sb.filter(b=>b.p==S.proj).forEach(b=>{g(key(b.date)).s+=+b.amt||0});
  let cum=0;const rows=Object.keys(m).sort().map(k=>{const r=m[k],t=r.m+r.l+r.s;cum+=t;const p1=f.budget?t/f.budget*100:0,p2=f.budget?cum/f.budget*100:0;
    return `<tr><td>${BP=='week'?'Week of '+k:k}</td><td class="r">${$(r.m)}</td><td class="r">${$(r.l)}</td><td class="r">${$(r.s)}</td><td class="r">${$(t)}</td><td class="r">${f.budget?p1.toFixed(1)+'%':'-'}</td><td><div class="pcell"><span>${f.budget?p2.toFixed(1)+'%':'-'}</span><div class="bar ${p2>100?'over':''}"><i style="width:${Math.min(100,p2)}%"></i></div></div></td></tr>`});
  const mt=tot(Object.values(m),'m'),lt=tot(Object.values(m),'l'),st=tot(Object.values(m),'s');
  return `<h2>Budget Consumption</h2>${sel()}<div class="card" style="margin-bottom:12px"><label for="bp">Show per</label><select id="bp" onchange="BP=this.value;draw()"><option value="week"${BP=='week'?' selected':''}>Week</option><option value="month"${BP=='month'?' selected':''}>Month</option><option value="year"${BP=='year'?' selected':''}>Year</option></select></div>
  <div class="grid">${cd($(f.budget),'Budget (estimates)')}${cd(pc(mt,f.budget),'Materials used')}${cd(pc(lt,f.budget),'Labor used')}${cd(pc(st,f.budget),'Subcontractors used')}${cd(pc(mt+lt+st,f.budget),'Total budget used',(f.budget&&mt+lt+st>f.budget)?'red':'')}</div>
  ${f.budget?'':'<div class="note">Enter the estimates first in Contract & Variance. Percentages need a budget.</div>'}

inc(){if(S.role!='admin')return'';const L2=pk('inc'),byM={};L2.forEach(x=>byM[x.date.slice(0,7)]=(byM[x.date.slice(0,7)]||0)+(+x.amt||0));
  return `<h2>Income Tracker</h2>${sel()}${frm('inc',[['Date received','date','date'],['From (client or payer)','from'],['Reference (billing or invoice no.)','ref','opt'],['Mode of payment','mode','sel',['Bank transfer','Check','Cash','Online']],['Amount','amt','number']])}

bill(){if(S.role!='admin')return'';const B=S.bill.filter(b=>b.p==S.proj);const cs=s=>(S.sc[S.proj+'|'+s]||{c:0}).c;

inv(){if(S.role!='admin')return'';const r=pk('iv').map(x=>{const bal=x.amt-(x.paid||0),od=bal>0&&x.due<today();return`<tr><td>${esc(x.no)}</td><td>${x.date}</td><td class="r">${$(x.amt)}</td><td class="r">${$(x.paid||0)}</td><td class="r">${$(bal)}</td><td class="${od?'red':''}">${x.due}${od?' (overdue)':''}</td></tr>`}),out=sum(pex()),C=tot(pk('inc'));

sub(){if(S.role!='admin')return'';const subs=S.sub.map((s,i)=>({s,i})).filter(x=>x.s.p==S.proj);
  const billed=i=>tot(S.sb.filter(b=>b.si==i));

vo(){if(S.role!='admin')return'';const L2=pex();const r=pk('vo').map(v=>{const c=sum(L2.filter(e=>e.type=='Variation Order'&&e.vo==v.no)),m=(+v.price||0)-c;return`<tr><td>${v.date||'-'}</td><td>${esc(v.no)}</td><td>${esc(v.desc)}</td><td class="r">${$(v.price)}</td><td class="r">${$(c)}</td><td class="r ${m<0?'red':'ok'}">${$(m)}</td></tr>`});

lead(){return `<h2>Project Leads</h2><form onsubmit="return addL(this)"><div><label for="l_n">Name</label><input id="l_n" name="n" required></div><div><label for="l_d">Date Inquired</label><input id="l_d" type="date" name="d" value="${today()}"></div><div><label for="l_c">Contact</label><input id="l_c" name="c"></div><div><label for="l_t">Notes</label><input id="l_t" name="t"></div><div><label for="l_ph">Phase</label><select id="l_ph" name="ph">${opt(['Design Only','For Quotation'])}</select></div><div><label for="l_st">Status</label><select id="l_st" name="st">${opt(['Not started','In Progress','Sent'])}</select></div><div><label for="l_res">Results</label><select id="l_res" name="res">${opt(['Awaiting Reply','Accepted'])}</select></div><div><label>&nbsp;</label><button class="p">Add</button></div></form>

function expGraph(L2){
  const adm=S.role=='admin',T=sum(L2),f=fin(S.proj),byTag={};
  L2.forEach(e=>byTag[e.sc]=(byTag[e.sc]||0)+(+e.amt||0));

    const est=s=>+((S.sc[S.proj+'|'+s]||{}).e)||0;
    const items=f.budget?[{l:'All expenses',v:T/f.budget*100,t:(T/f.budget*100).toFixed(1)+'%'}].concat(SC.filter(s=>est(s)>0).map(s=>{const p=(byTag[s]||0)/est(s)*100;return{l:s,v:p,t:p.toFixed(1)+'%'}})):[];
    return `<h3>Percent of budget spent</h3><div class="card" style="margin-bottom:12px">${items.length?bars(items):'<p class="mut">Enter the estimates first in Contract & Variance to see the percent of budget spent.</p>'}<p style="margin:12px 0 0"><button type="button" class="btn" onclick="nav('bu')">See budget used per week, month and year</button></p></div>`}

  return `<h2>Studies</h2><p class="mut">Design studies for clients and projects, such as floor plan, elevation, 3D perspective, site and cost studies.</p>
  <div class="grid" style="margin-bottom:12px">${cd(n('In Progress'),'In progress')}${cd(n('For review'),'For review')}${cd(L2.filter(r=>od(r.x)).length,'Overdue',L2.some(r=>od(r.x))?'red':'')}${cd(n('Sent to client')+n('Approved'),'Sent or approved')}</div>
  ${frm('stu',[['Project or client','n','text',null,'list="dnlist"'],['Type of study','type','sel',STY],['Date requested','d','date'],['Due date','due','dopt'],['Assigned to','as','opt'],['Status','st','sel',STS],['Remarks','rm','opt']],'Add study')}
  ${tbl(['Project or client','Type','Requested','Due','Assigned to','Status','Remarks'],L2.map(({x,i})=>`<tr><td>${esc(x.n)}</td><td>${esc(x.type)}</td><td>${x.d}</td><td class="${od(x)?'red':''}">${x.due||'-'}${od(x)?' (overdue)':''}</td><td>${esc(x.as)}</td><td><select aria-label="Status" onchange="setF('stu',${i},'st',this.value)">${opt(STS,x.st)}</select></td><td>${esc(x.rm)}</td></tr>`))}`};

/* Permits and approvals, per project and city hall */
V.pm=()=>{
  const rows=rowsOf('pm'),done=rows.filter(r=>isDone(r.x.st)).length,pct=rows.length?done/rows.length*100:0;
  const matrix=P.map((n,i)=>`<tr><td><a href="#" onclick="S.proj=${i};save();draw();return false">${esc(n)}</a></td><td>${esc(S.lgu[i]||'-')}</td>${PS.map(s=>{const e=S.pm.find(x=>x.p==i&&x.step==s);return `<td class="${e&&isDone(e.st)?'ok':''}">${e?esc(e.st):'-'}</td>`}).join('')}</tr>`);
  return `<h2>Permits & Approvals</h2>${sel()}<p class="mut">Building permit, Meralco, water, occupancy and final electrical inspection for this project. Set the city hall, then update each step as it moves.</p>
  <div class="card" style="margin-bottom:12px"><label for="lgu">City hall / LGU for this project</label><input id="lgu" list="lgulist" value="${esc(S.lgu[S.proj]||'')}" onchange="S.lgu[S.proj]=this.value;save();draw()"></div>
  <div class="card" style="margin-bottom:12px">${bars([{l:'Permits approved',v:pct,t:done+' of '+rows.length}])}</div>
  ${tbl(['Permit / approval','Status','Date submitted','Date released','Reference no.','Fee','Remarks'],rows.map(({x,i})=>`<tr><td><span class="${isDone(x.st)?'ok':x.st=='For revision'?'red':''}">${esc(x.step)}</span></td><td><select aria-label="Status" onchange="setF('pm',${i},'st',this.value)">${opt(PST,x.st)}</select></td><td><input type="date" aria-label="Date submitted" value="${esc(x.sub)}" onchange="setF('pm',${i},'sub',this.value)"></td><td><input type="date" aria-label="Date released" value="${esc(x.rel)}" onchange="setF('pm',${i},'rel',this.value)"></td><td><input aria-label="Reference no." value="${esc(x.ref)}" onchange="setF('pm',${i},'ref',this.value)"></td><td><input type="number" step="any" inputmode="decimal" aria-label="Fee" value="${esc(x.fee)}" onchange="setF('pm',${i},'fee',this.value)"></td><td><input aria-label="Remarks" value="${esc(x.rm)}" onchange="setF('pm',${i},'rm',this.value)"></td></tr>`))}
  <h3>Add another permit or approval</h3>${frm('pm',[['Permit or approval','step']],'Add')}
  <h3>All projects</h3>${tbl(['Project','City hall'].concat(PS),matrix)}`};

/* Amilyar (real property tax) */
V.tax=()=>{if(S.role!='admin')return'';
  const R=rowsOf('rpt').sort((a,b)=>(+a.x.year-+b.x.year)||String(a.x.inst).localeCompare(String(b.x.inst))),xs=R.map(r=>r.x);
  const due=tot(xs,'amt'),paid=tot(xs,'paid'),bal=due-paid,byP={};
  S.rpt.forEach(x=>{byP[P[x.p]]=(byP[P[x.p]]||0)+(+x.amt||0)});
  return `<h2>Amilyar (Real Property Tax)</h2>${sel()}<p class="mut">Real property tax of this project. Record each year or installment, then enter the payment when it is made.</p>
  <div class="grid" style="margin-bottom:12px">${cd($(due),'Total tax due')}${cd($(paid),'Paid','ok')}${cd($(bal),'Balance',bal>0?'red':'')}</div>
  <div class="grid" style="margin-bottom:12px"><div class="card"><h3 style="margin-top:0">Paid and unpaid</h3>${pie(Object.fromEntries([['Paid',paid],['Unpaid',Math.max(0,bal)]].filter(e=>e[1]>0)))}</div><div class="card"><h3 style="margin-top:0">Tax due by project</h3>${pie(byP)}</div></div>
  ${frm('rpt',[['Tax declaration no.','td','opt'],['Year','year','number'],['Installment','inst','sel',['Annual','Q1','Q2','Q3','Q4']],['Due date','due','date'],['Amount due','amt','number'],['Amount paid so far','paid','num0'],['Date paid','pd','dopt'],['OR no.','orn','opt']],'Add tax record')}
  ${tbl(['Year','Installment','Tax declaration no.','Due date','Amount due','Amount paid','Date paid','OR no.','Balance'],R.map(({x,i})=>{const b=(+x.amt||0)-(+x.paid||0),od=b>0&&x.due<today();return `<tr><td>${esc(x.year)}</td><td>${esc(x.inst)}</td><td>${esc(x.td)}</td><td class="${od?'red':''}">${x.due}${od?' (overdue)':''}</td><td class="r">${$(x.amt)}</td><td><input type="number" step="any" inputmode="decimal" aria-label="Amount paid" value="${esc(x.paid)}" onchange="setF('rpt',${i},'paid',this.value)"></td><td><input type="date" aria-label="Date paid" value="${esc(x.pd)}" onchange="setF('rpt',${i},'pd',this.value)"></td><td><input aria-label="OR no." value="${esc(x.orn)}" onchange="setF('rpt',${i},'orn',this.value)"></td><td class="r ${b>0?'':'ok'}">${$(b)}</td></tr>`}))}`};

const AT=['ex','bill','leads','dt','dl','sm','rq','tk','py','iv','po','dx','dpay','vo','wr','at','tool','sub','sb','inc','sl','dis','dprog','bj','stu','pm','rpt'];
const strip=o=>JSON.stringify(o,(k,v)=>k=='h'?undefined:k=='img'?'[receipt]':v);
const snap=()=>{const o={};AT.forEach(k=>o[k]=(S[k]||[]).map(strip));o.sc=Object.entries(S.sc).map(([k,v])=>k+'='+JSON.stringify(v));o.lgu=Object.entries(S.lgu).map(([k,v])=>k+'='+v);o.users=S.users.map(strip);return o};
const dif=(o,n)=>{try{const a=JSON.parse(o),b=JSON.parse(n),ks=Object.keys({...a,...b}).filter(k=>JSON.stringify(a[k])!=JSON.stringify(b[k]));return[ks.map(k=>k+': '+JSON.stringify(a[k])).join('; '),ks.map(k=>k+': '+JSON.stringify(b[k])).join('; ')]}catch(e){return[o,n]}};
function audit(b){if(!S.me)return;const a=snap(),t=(d=>new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16).replace('T',' '))(new Date());Object.keys(a).forEach(k=>{const x=[...(b[k]||[])],y=[];a[k].forEach(v=>{const i=x.indexOf(v);i<0?y.push(v):x.splice(i,1)});const Lg=(act,o,n)=>S.al.push({t,u:S.me,r:S.role,tbl:k,act,o,n});if(x.length&&x.length==y.length)x.forEach((v,i)=>{const d=dif(v,y[i]);Lg('edit',d[0],d[1])});else{x.forEach(v=>Lg('delete',v,''));y.forEach(v=>Lg('create','',v))}});if(S.al.length>1000)S.al=S.al.slice(-1000);save()}
let LS=snap();const _draw=draw;draw=function(){try{audit(LS);LS=snap();_draw()}catch(e){showErr(e)}};
let AF={u:'',d:'',p:''};
const TL={users:'Users',ex:'Expenses',bill:'Progress billing',leads:'Project leads',dt:'Design projects',dl:'Delivery check',sm:'Stocks',rq:'Requests',tk:'Tasks',py:'Payroll (old)',iv:'Invoices',po:'Purchase orders',dx:'Design expenses',dpay:'Design payroll',vo:'Additional works',wr:'Workers',at:'Attendance',tool:'Tools',sub:'Subcontracts',sb:'Subcontract billings',inc:'Income',sl:'Suppliers',dis:'Disbursement',dprog:'Daily site progress',bj:'Back jobs',stu:'Studies',pm:'Permits',rpt:'Property tax',sc:'Contract & estimate',lgu:'City hall'};
const AL={create:'Created',edit:'Edited',delete:'Deleted'};
const roleOf=x=>x.r||((S.users.find(u=>u.name==x.u)||{}).role)||(x.u=='Admin'?'admin':'staff');
const KL={name:'Name',role:'Role',email:'Email',p:'Project',date:'Date',d:'Date',sc:'Tag',ct:'Category',sup:'Supplier',desc:'Description',qty:'Qty',unit:'Unit',amt:'Amount',sf:'Source of funds',rec:'Recipient',rno:'Receipt no.',type:'Entry type',vo:'VO no.',s:'Scope',pct:'% complete',no:'No.',total:'Total',paid:'Paid',del:'Delivery',items:'Items',work:'Work done',wx:'Weather',rm:'Remarks',st:'Status',kind:'Type',by:'By',t:'Task',who:'Assigned to',days:'Days',rate:'Daily rate',oh:'OT hours',ot:'OT rate',or:'OT rate',cond:'Condition',holder:'Held by',site:'Site',scope:'Scope of work',w:'Worker',si:'Subcontractor',item:'Item',move:'Movement',n:'Name',c:'Contact',ph:'Phase',res:'Result',tg:'Target date',sn:'Sheet no.',ds:'Date started',sb:'Submission date',as:'Assigned to',fee:'Fee',billed:'Billed',loc:'Location',own:'Owner',step:'Permit',ref:'Reference',year:'Year',inst:'Installment',due:'Due date',orn:'OR no.',pd:'Date paid',td:'Tax declaration no.',cost:'Estimated cost',fixed:'Date fixed',mode:'Mode',person:'Contact person',phone:'Phone',addr:'Address',price:'Price',mat:'Material',l:'Length',h:'Height',sub:'Date submitted',rel:'Date released',img:'Photo',hist:'Transfers',from:'From',to:'To'};
const KO={'at.d':'Attendance','dl.n':'Loads / pieces','dl.w':'Width','dl.price':'Price per unit','dl.paid':'Amount paid','dt.sc':'Scopes','sb.date':'Date of billing'};
const MK=new Set(['amt','paid','total','price','fee','cost','rate','ot','or','billed']);
const fv=(t,k,v)=>{
  if(v===''||v==null||v==='undefined')return'-';
  if(Array.isArray(v))return v.length+(v.length==1?' item':' items');
  if(typeof v=='object')return Object.entries(v).map(([a,b])=>(KL[a]||a)+' '+fv(t,a,b)).join(', ');
  if((k=='p'||k=='site')&&P[v]!=null)return P[v];
  if(t=='at'&&k=='d')return AM[v]||String(v);
  if(t=='at'&&k=='w')return S.wr[v]?S.wr[v].name:'Worker '+(+v+1);
  if(t=='sb'&&k=='si')return S.sub[v]?S.sub[v].name:'Contract '+(+v+1);
  if(k=='pct')return v+'%';
  if(MK.has(k)&&!isNaN(+v))return $(v);
  return String(v).slice(0,120)};
/* Turns a stored audit value (JSON, or the older "field: value; field: value" text) into readable lines. */
function fa(t,s){
  s=String(s==null?'':s);if(!s)return'-';
  let pr=null;
  try{const o=JSON.parse(s);if(o&&typeof o=='object'&&!Array.isArray(o))pr=Object.entries(o)}catch(e){}
  if(!pr&&t=='sc'){const i=s.indexOf('='),k=s.slice(0,i),j=k.indexOf('|');try{const o=JSON.parse(s.slice(i+1));return '<div class="av">'+esc((P[+k.slice(0,j)]||'Project')+' / '+k.slice(j+1))+'<br><b>Contract:</b> '+esc($(o.c))+'<br><b>Estimate:</b> '+esc($(o.e))+'</div>'}catch(e){}}
  if(!pr&&t=='lgu'){const i=s.indexOf('=');return '<div class="av">'+esc(P[+s.slice(0,i)]||'Project')+'<br><b>City hall:</b> '+esc(s.slice(i+1)||'-')+'</div>'}
  if(!pr){pr=[];for(const part of s.split(/; (?=[A-Za-z0-9_]+: )/)){const i=part.indexOf(': ');if(i<0){pr=null;break}let v=part.slice(i+2);try{v=JSON.parse(v)}catch(e){}pr.push([part.slice(0,i),v])}}
  if(!pr||!pr.length)return esc(s.slice(0,160));
  return '<div class="av">'+pr.map(([k,v])=>'<b>'+esc(KO[t+'.'+k]||KL[k]||k)+':</b> '+esc(fv(t,k,v))).join('<br>')+'</div>'}
V.audit=()=>{if(S.role!='admin')return'';const L2=S.al.filter(x=>(!AF.u||roleOf(x)==AF.u)&&(!AF.d||x.t.slice(0,10)==AF.d)&&(AF.p===''||new RegExp('"p":'+AF.p+'[,}]|(^|; )p: '+AF.p+'($|;)').test(x.o+x.n))).slice(-200).reverse();
  return `<h2>Audit Log</h2><p class="mut">Every create, edit and delete is recorded with the old and new value. There is no way to edit or delete the log.</p><div class="grid" style="margin-bottom:12px"><div><label for="a_u">Show</label><select id="a_u" onchange="AF.u=this.value;draw()"><option value="">All</option><option value="admin"${AF.u=='admin'?' selected':''}>Admin</option><option value="staff"${AF.u=='staff'?' selected':''}>Staff</option></select></div><div><label for="a_d">Date</label><input id="a_d" type="date" value="${AF.d}" onchange="AF.d=this.value;draw()"></div><div><label for="a_p">Project</label><select id="a_p" onchange="AF.p=this.value;draw()"><option value="">All</option>${P.map((n,i)=>`<option value="${i}"${AF.p!==''&&AF.p==i?' selected':''}>${esc(n)}</option>`).join('')}</select></div></div>${tbl(['Time','User','Table','Action','Old value','New value'],L2.map(x=>`<tr><td>${x.t}</td><td>${esc(x.u)} (${roleOf(x)})</td><td>${esc(TL[x.tbl]||x.tbl)}</td><td>${AL[x.act]||esc(x.act)}</td><td>${fa(x.tbl,x.o)}</td><td>${fa(x.tbl,x.n)}</td></tr>`))}`};
try{history.replaceState({t:S.tab,dp:S.dp,n:0},'')}catch(e){}
{const lg=document.getElementById('logo');if(lg)lg.src=LOGO}
save();draw();idle();
</script></body></html>
