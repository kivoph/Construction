<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Construction Cost Control</title>
<style>
:root{--bg:#f4f6fb;--fg:#14213d;--mut:#5b6785;--nav:#14213d;--surf:#fff;--soft:#eef2fb;--line:#d9deea;--acc:#2f6bff;--red:#c62828;--ok:#2e7d32;--shadow:0 2px 12px #14213d14;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--fg:#e8ecf7;--mut:#9aa6c4;--nav:#1b2a52;--surf:#151d36;--soft:#1d2746;--line:#2a3558;--acc:#5b8def;--red:#ef5350;--ok:#66bb6a;--shadow:0 2px 12px #0006;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--fg:#e8ecf7;--mut:#9aa6c4;--nav:#1b2a52;--surf:#151d36;--soft:#1d2746;--line:#2a3558;--acc:#5b8def;--red:#ef5350;--ok:#66bb6a;--shadow:0 2px 12px #0006;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
header{background:linear-gradient(135deg,var(--nav),var(--acc));color:#fff;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-radius:0 0 20px 20px;box-shadow:var(--shadow)}
header b{font-size:18px;letter-spacing:.2px}
#who{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.hbtn{background:#ffffff26;color:#fff;border:0;border-radius:999px;padding:0 16px;min-height:40px;font:inherit;font-size:13px;cursor:pointer}
.hbtn:hover{background:#ffffff40}
#bar{position:sticky;top:0;z-index:5;background:var(--bg);max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
#bar:empty{display:none}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;min-width:0;font-size:14px}
.crumb{background:none;border:0;padding:6px 2px;min-height:36px;color:var(--acc);font:inherit;cursor:pointer;text-align:left}
.crumb:hover{text-decoration:underline}
.cur{padding:6px 2px;color:var(--mut);font-weight:600}
.sep{padding:0 6px;color:var(--mut)}
main{max-width:1200px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h2{font-size:22px;margin:8px 0 6px;line-height:1.25}
h3{font-size:16px;margin:22px 0 10px}
p{margin:0 0 10px}
.lead{margin:0 0 14px}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.grid>*,form>*{min-width:0}
.card{background:var(--surf);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px}
.card .n{font-size:26px;font-weight:700;color:var(--acc);line-height:1.2}
.card .n.red{color:var(--red)}.card .n.ok{color:var(--ok)}
.nav-card{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;position:relative;padding-right:40px;min-height:64px;justify-content:center}
.nav-card b{font-size:16px}
.nav-card::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;border-top:2px solid var(--mut);border-right:2px solid var(--mut);transform:translateY(-50%) rotate(45deg)}
.nav-card:hover{background:var(--soft)}
.nav-card:active{transform:scale(.98)}
.wrap{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--soft);color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:10px;text-align:left}
td{padding:10px;background:var(--surf);border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
tr:hover td{background:var(--soft)}
.red{color:var(--red);font-weight:700}.ok{color:var(--ok);font-weight:700}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.card form{background:none;border:0;box-shadow:none;padding:0;margin:0}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
input,select{font:inherit;font-size:16px;width:100%;min-width:0;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--fg)}
td input,td select{min-height:38px;font-size:14px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit}
button.p{width:100%;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;transition:transform .1s,filter .1s}
button.p:hover{filter:brightness(1.08)}button.p:active{transform:scale(.97)}
.btn,td button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surf);color:var(--fg);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover,td button:hover{background:var(--soft)}
label.btn{margin:0;color:var(--fg);font-size:13px}
.back{min-height:40px;padding:0 16px 0 12px;gap:8px;background:var(--surf);box-shadow:var(--shadow);font-size:14px}
.back::before{content:"";width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:4px}
.note{background:var(--soft);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;font-size:13px;margin:14px 0}
.pie{width:150px;height:150px;border-radius:50%;flex:none}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:600;line-height:1.6}
.bar{height:8px;min-width:80px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.over i{background:var(--red)}
.pcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pcell .bar{flex:1 1 80px;max-width:140px}
a{color:var(--acc)}
.login{max-width:380px;margin:30px auto}
.login form{grid-template-columns:1fr;border:0;box-shadow:none;padding:0;margin:0}
.ov{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:99;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov .ovbar{align-self:flex-start}
.ov img{max-width:100%;max-height:80vh;max-height:80dvh;object-fit:contain}
main>*{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){main>*{animation:none}*{transition:none!important}}
@media(max-width:700px){
  h2{font-size:20px}
  .wrap{overflow:visible;background:none;border:0;box-shadow:none}
  table.rt,.rt tbody,.rt tr,.rt td{display:block;width:100%;min-width:0}
  .rt tr.hd{display:none}
  .rt tr{background:var(--surf);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px 0;margin-bottom:10px}
  .rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:7px 14px;text-align:right;background:none}
  .rt tr:hover td{background:none}
  .rt td[data-label]:not([data-label=""])::before{content:attr(data-label);color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px;text-align:left;flex:none;max-width:45%}
  .rt td[data-label=""]{justify-content:flex-end;flex-wrap:wrap}
  .rt td[colspan]{display:block;text-align:left}
  .rt td:empty{display:none}
  .rt td input,.rt td select{width:55%;flex:1 1 55%}
}
@media(max-width:480px){
  header b{font-size:16px}
  .card{padding:14px}
  .card .n{font-size:22px}
  .pie{width:130px;height:130px}
}
</style></head>
<body>
<header><b>Construction Cost Control</b>
<span id="who"></span></header>
<div id="bar"></div><main id="m"></main>
<datalist id="suplist"></datalist>
<script>
const P=['Two Storey Solaya Admin','One Storey Solaya Dormitory','Solaya Guardhouse and Entry Gateway','Three Storey Residence Venare, Nuvali'];
const SC=['Architectural','Electrical','Plumbing','Structural','Landscape','Roofing and Trusses','General Requirements & Overhead'];
const CT=['Structural','Finishing','Electrical','Sanitary','Labor','Tools','Equipment Rental','Aggregates & Masonry','Hardware / General Materials','Scaffolding & Formworks','Professional & Testing Fees','Engineering Consultancy','Transport & Delivery','Fuel & Gas','Site Welfare','Admin & Misc'];
const SF=['BDO','BPI','Petty Cash'];
const DN=['Two Storey Agustin House 1','Two Storey Agustin House 2','Solaya Function Hall','Solaya Admin','Solaya Dorm','Solaya Guardhouse and Admin','Kahel Residence','Luciano Residence','Chong Residence','Nagcarlan Dormitel'];
const DS=['Not started','In Progress','ForApproval','Approved','Done'];
const RET=0.10,VAT=0.12;

/* Password hashing in plain JavaScript, so sign-in works in every browser and viewer (the browser's own crypto is missing on non-secure pages). Same SHA-256 result as before, so saved users still work. */
function sha256(str){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));
  const K=[],Hs=[];
  for(let n=2,c=0;c<64;n++){let pr=1;for(let i=2;i*i<=n;i++)if(n%i==0){pr=0;break}if(pr){if(c<8)Hs[c]=(Math.pow(n,.5)*4294967296)|0;K[c++]=(Math.pow(n,1/3)*4294967296)|0}}
  let m=unescape(encodeURIComponent(str));const bl=m.length*8;m+='\x80';while(m.length%64!=56)m+='\0';
  const w=[];for(let i=0;i<m.length;i++)w[i>>2]|=m.charCodeAt(i)<<(24-(i%4)*8);
  w.push((bl/4294967296)|0,bl|0);
  let h=Hs.slice();
  for(let o=0;o<w.length;o+=16){
    const x=w.slice(o,o+16),a0=h.slice();
    let[a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      if(i>=16){const w15=x[i-15],w2=x[i-2];x[i]=(x[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+x[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0}
      const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+x[i])|0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    h=[a,b,c,d,e,f,g,hh].map((v,i)=>(v+a0[i])|0)}
  return h.map(v=>('00000000'+(v>>>0).toString(16)).slice(-8)).join('')}
const H=s=>sha256('ccc:'+s);

/* Saved data. Every list is given a safe default, so older saved data from earlier versions cannot break sign-in. */
let S;try{S=JSON.parse(localStorage.getItem('ccc'))}catch(e){}
if(!S||typeof S!='object'||Array.isArray(S))S={};
['ex','bill','leads','dl','sm','tl','rq','tk','py','iv','wr','at','tool','sub','sb','inc','sl','dis','users','po','vo','dx','dpay','al'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
if(!S.sc||typeof S.sc!='object'||Array.isArray(S.sc))S.sc={};
if(!Array.isArray(S.dt)||!S.dt.length)S.dt=DN.map(n=>({n,sc:[],fee:0,billed:0,paid:0}));
S.dt.forEach(p=>{if(!Array.isArray(p.sc))p.sc=[]});
S.role=S.role||'staff';S.tab=S.tab||'home';S.proj=(+S.proj>=0&&+S.proj<P.length)?+S.proj:0;S.dp=(S.dp==null)?-1:+S.dp;
/* Scope names changed to the new material tags. Older entries are carried over. */
const RN={Finishing:'Architectural',Sanitary:'Plumbing'};
S.ex.forEach(e=>{if(RN[e.sc])e.sc=RN[e.sc]});
S.bill.forEach(b=>{if(RN[b.s])b.s=RN[b.s]});
Object.keys(S.sc).forEach(k=>{const i=k.indexOf('|'),p=k.slice(0,i),s=k.slice(i+1);if(RN[s]){S.sc[p+'|'+RN[s]]=S.sc[k];delete S.sc[k]}});
if(!S.tlm){S.tl.forEach(x=>S.tool.push({name:x.tool,cond:x.cond,holder:x.holder||'',site:+x.p||0,hist:[]}));S.tlm=1}
S.tool.forEach(t=>{if(!Array.isArray(t.hist))t.hist=[]});
if(!S.users.length)S.users=[{name:'Admin',email:'admin@demo.com',role:'admin',h:H('admin123')},{name:'Staff',email:'staff@demo.com',role:'staff',h:H('staff123')}];

const save=()=>{try{localStorage.setItem('ccc',JSON.stringify(S))}catch(e){}};
const $=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opt=(a,v)=>a.map((x,i)=>`<option value="${typeof x=='string'?esc(x):i}"${(typeof x=='string'?x:i)==v?' selected':''}>${esc(x)}</option>`).join('');
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const tot=(a,f='amt')=>a.reduce((t,x)=>t+(+x[f]||0),0);
const pc=(x,t)=>t?(x/t*100).toFixed(1)+'%':'-';

/* Structure follows the web app plan: Home, then the parts, then pages. */
const L={ov:'Project Overview',ex:'Expenses',mat:'Materials Cost',py:'Attendance & Payroll',dis:'Disbursement',del:'Delivery Check',sp:'Suppliers',tools:'Tools',stk:'Stocks',po:'Purchase Orders',req:'Requests',tk:'Tasks',wk:'Weekly Report',sum:'Summary',pd:'Project Details',cv:'Contract & Variance',bu:'Budget Consumption',inc:'Income Tracker',bill:'Progress Billing',inv:'Invoices & Cash Flow',sub:'Subcontract Billing',vo:'Additional Works',lead:'Project Leads',ong:'Design Ongoing',dsn:'Design Summary',dop:'Design Opex & Payroll',users:'Users',audit:'Audit Log'};
const PD={ov:'Costs, workers, tools and tasks of one project at a glance.',ex:'Record every receipt and tag where it goes.',mat:'Materials cost by tag, shown as a pie chart.',py:'Daily attendance, overtime and weekly payroll.',dis:'Deliveries: date, items and cost.',del:'Gravel, sand and CHB volume checked against payment.',sp:'Supplier names, contact details and address.',tools:'Which site each tool is at, and where it moved.',stk:'Stock in and out.',po:'Purchase orders with down payment and delivery status.',req:'Purchase requests and petty cash for approval.',tk:'Tasks per project and per staff.',wk:'Expenses for any Sunday to Saturday week.',sum:'Gross income, remaining budget, remaining balance and billings.',pd:'All projects with their total cost.',cv:'Contract, estimate and actual cost per tag.',bu:'How the budget is used by materials and labor, per week, month and year.',inc:'Money received from clients.',bill:'Bill by scope with VAT and retention.',inv:'Client invoices and cash flow.',sub:'Subcontractor and 3rd party contracts, billings and balance.',vo:'Additional works with start date and cost.',lead:'All design and construction inquiries.',ong:'Design projects with progress and deadlines.',dsn:'Contract fee, billed and paid per design project.',dop:'Operating expenses and in-house design payroll.',users:'Create users and change roles.',audit:'Every create, edit and delete.'};
const SECS={
 cs:['Construction (Staff)','s','Overview, expenses, materials cost, attendance and payroll, disbursement, suppliers, tools, stocks, requests and tasks.',['ov','ex','mat','py','dis','del','sp','tools','stk','po','req','tk','wk']],
 ca:['Construction (Admin)','a','Summary, project details, budget consumption, income, billing, subcontractors and additional works.',['sum','pd','cv','bu','inc','bill','inv','sub','vo']],
 ds:['Design (Staff)','s','Project leads, list of ongoing design projects and project pages.',['lead','ong']],
 da:['Design (Admin)','a','Design contract fee summary, operating expenses and design payroll.',['dsn','dop']],
 ad:['Administration','a','Users and roles, and the audit log.',['users','audit']]};
const secOf=t=>Object.keys(SECS).find(k=>SECS[k][3].includes(t));
const canSec=k=>SECS[k][1]=='s'||S.role=='admin';
const ok=t=>t=='home'||(SECS[t]?canSec(t):!!(L[t]&&secOf(t)&&canSec(secOf(t))));

/* Navigation: every page has a Back button. It uses the browser history when there is one, otherwise goes to the parent page. */
const hs=()=>{try{return history.state}catch(e){return null}};
function nav(t,dp){const n=((hs()&&hs().n)||0)+1;S.tab=t;S.dp=dp==null?-1:dp;save();try{history.pushState({t:S.tab,dp:S.dp,n},'')}catch(e){}draw();window.scrollTo(0,0)}
function parentOf(){if(S.tab=='ong'&&S.dp>=0)return['ong',-1];if(SECS[S.tab])return['home',-1];return[secOf(S.tab)||'home',-1]}
function back(){const h=hs();if(h&&h.n>0){try{history.back();return}catch(e){}}const p=parentOf();S.tab=p[0];S.dp=p[1];save();draw();window.scrollTo(0,0)}
addEventListener('popstate',e=>{if(!S.me)return;const s=e.state;if(s&&s.t&&ok(s.t)){S.tab=s.t;S.dp=s.dp==null?-1:s.dp}else{S.tab='home';S.dp=-1}save();draw()});
function bar(){
  if(S.tab=='home')return'';
  const sp='<span class="sep">/</span>';
  let c='<button type="button" class="btn back" onclick="back()">Back</button><div class="crumbs"><button type="button" class="crumb" onclick="nav(\'home\')">Home</button>'+sp;
  if(SECS[S.tab])c+=`<span class="cur">${SECS[S.tab][0]}</span>`;
  else{const s=secOf(S.tab);c+=`<button type="button" class="crumb" onclick="nav('${s}')">${SECS[s][0]}</button>${sp}`;
    if(S.tab=='ong'&&S.dp>=0&&S.dt[S.dp])c+=`<button type="button" class="crumb" onclick="nav('ong')">${L.ong}</button>${sp}<span class="cur">${esc(S.dt[S.dp].n)}</span>`;
    else c+=`<span class="cur">${L[S.tab]}</span>`}
  return c+'</div>'}
function secView(k){const s=SECS[k];return `<h2>${s[0]}</h2><p class="mut lead">${s[2]}</p><div class="grid">${s[3].map(p=>`<button type="button" class="card nav-card" onclick="nav('${p}')"><b>${L[p]}</b><span class="mut">${PD[p]}</span></button>`).join('')}</div>`}

/* On narrow screens every table turns into stacked cards; labels come from the header row. */
function mkRT(){document.querySelectorAll('#m table').forEach(t=>{t.classList.add('rt');const rows=[...t.querySelectorAll('tr')],h=rows[0];if(!h||!h.querySelector('th'))return;const hl=[...h.children].map(c=>c.textContent.trim());h.classList.add('hd');rows.slice(1).forEach(r=>{let i=0;[...r.children].forEach(c=>{c.setAttribute('data-label',c.colSpan>1?'':(hl[i]||''));i+=c.colSpan||1})})})}

const pex=()=>S.ex.filter(e=>e.p==S.proj);
const sum=a=>tot(a);
const pk=k=>S[k].filter(x=>x.p==S.proj);
const sel=()=>`<div class="card" style="margin-bottom:12px"><label for="projsel">Project</label><select id="projsel" onchange="S.proj=+this.value;save();draw()">${opt(P,S.proj)}</select></div>`;
let FID=0;
function draw(){
  const u=S.users.find(x=>x.name==S.me);
  if(!u){S.me=null;return loginView()}
  S.role=u.role;FID=0;
  document.getElementById('who').innerHTML=`<span>${esc(u.name)} (${u.role})</span> <button type="button" class="hbtn" onclick="logout()">Sign out</button>`;
  if(!ok(S.tab)){S.tab='home';S.dp=-1}
  document.getElementById('bar').innerHTML=bar();
  document.getElementById('m').innerHTML=SECS[S.tab]?secView(S.tab):V[S.tab]();
  const dl=document.getElementById('suplist');if(dl)dl.innerHTML=S.sl.map(s=>`<option value="${esc(s.name)}"></option>`).join('');
  mkRT();
}

/* Labor, income and budget numbers used by several pages */
const otr=w=>(+w.ot)||((+w.rate||0)/8*1.25);
const attPay=a=>{const w=S.wr[a.w];return w?(+a.d||0)*(+w.rate||0)+(+a.oh||0)*otr(w):0};
const laborAtt=p=>S.at.filter(a=>a.p==p).reduce((t,a)=>t+attPay(a),0);
function fin(p){
  const sc=s=>S.sc[p+'|'+s]||{c:0,e:0};let contract=0,budget=0;
  SC.forEach(s=>{contract+=+sc(s).c||0;budget+=+sc(s).e||0});
  const aw=tot(S.vo.filter(v=>v.p==p),'price'),exp=tot(S.ex.filter(e=>e.p==p)),lab=laborAtt(p),sb=tot(S.sb.filter(b=>b.p==p));
  const inc=tot(S.inc.filter(i=>i.p==p)),billed=S.bill.filter(b=>b.p==p).reduce((t,b)=>t+(+sc(b.s).c||0)*b.pct/100,0),inv=tot(S.iv.filter(i=>i.p==p));
  const value=contract+aw,cost=exp+lab+sb;
  return{contract,budget,aw,value,exp,lab,sb,cost,inc,billed,inv,remBudget:budget-cost,remBal:value-inc}}
const cd=(n,l,c='')=>`<div class="card"><div class="n ${c}">${n}</div><div class="mut">${l}</div></div>`;
const SITEC=['#1f5fe0','#2e7d32','#b26a00','#7b1fa2'];
const chip=i=>`<span class="chip" style="background:${SITEC[(+i||0)%SITEC.length]}">${esc(P[i]||'Unassigned')}</span>`;

function addEx(f){const d=new FormData(f);S.ex.push({p:S.proj,date:d.get('date'),sc:d.get('sc'),ct:d.get('ct'),sup:d.get('sup'),desc:d.get('desc'),qty:d.get('qty'),unit:d.get('unit'),amt:+d.get('amt'),sf:d.get('sf'),rec:d.get('rec'),rno:d.get('rno'),type:d.get('type'),vo:d.get('vo')});save();draw();return false}
function delEx(i){if(confirm('Delete this expense?')){S.ex.splice(i,1);save();draw()}}
function pie(m){const t=Object.values(m).reduce((a,b)=>a+b,0);if(!t)return '<p class="mut">No data yet.</p>';
  const cols=['#14213d','#2f5fb3','#5b8def','#9db8f0','#2e7d32','#f9a825','#c62828','#6d4c41','#00838f','#7b1fa2'];let a=0,g=[],l=[];
  Object.entries(m).forEach(([k,v],i)=>{const c=cols[i%cols.length],p=v/t*100;g.push(`${c} ${a}% ${a+p}%`);a+=p;l.push(`<div><span style="display:inline-block;width:10px;height:10px;background:${c};border-radius:2px"></span> ${esc(k)} - ${p.toFixed(1)}%</div>`)});
  return `<div class="row"><div class="pie" style="background:conic-gradient(${g.join(',')})"></div><div class="mut">${l.join('')}</div></div>`}
function wkRange(d){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()-x.getDay());const y=new Date(x);y.setDate(y.getDate()+6);const f=z=>new Date(z-z.getTimezoneOffset()*60000).toISOString().slice(0,10);return[f(x),f(y)]}

const frm=(k,fs,btn='Add')=>`<form onsubmit="return add('${k}',this)">${fs.map(fld).join('')}<div><label>&nbsp;</label><button class="p">${btn}</button></div></form>`;
const tbl=(h,r)=>`<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')||`<tr><td colspan="${h.length}" class="mut">Nothing yet.</td></tr>`}</table></div>`;
const AM={1:'Present',0.5:'Half day',0:'Absent'};
const V={
home(){const od=S.dt.reduce((n,p)=>n+p.sc.filter(s=>s.st!='Done'&&s.tg&&s.tg<today()).length,0);

  return `<h2>Hello, ${esc(S.me)}</h2><p class="mut lead">Here is where things stand today.</p><div class="grid">${cd(S.dt.filter(p=>p.sc.some(s=>s.st!='Done')).length,'Ongoing design projects')}${cd(od,'Overdue scopes',od?'red':'')}${cd(pend,'Requests waiting for approval')}${cd(aw,'Leads awaiting reply')}</div>

ov(){const f=fin(S.proj),t=today(),m={};

ex(){const L2=pex();return `<h2>Expenses</h2>${sel()}<form onsubmit="return addEx(this)">

mat(){const m={},c={};pex().forEach(e=>{m[e.sc]=(m[e.sc]||0)+(+e.amt||0);c[e.ct]=(c[e.ct]||0)+(+e.amt||0)});const T=Object.values(m).reduce((a,b)=>a+b,0);

cv(){if(S.role!='admin')return'';const k=s=>S.proj+'|'+s;const c=s=>S.sc[k(s)]||{c:0,e:0};const L2=pex();let tc=0,te=0,ta=0;

function resetPw(i){if(S.role!='admin')return;const p=prompt('New password (min 8 characters)');if(!p||p.length<8)return;S.users[i].h=H(p);save();alert('Password updated.')}
V.users=()=>{if(S.role!='admin')return'';return `<h2>Users & Roles</h2><p class="mut">Only admins can create users and change roles. Staff cannot see this page.</p>${frm0()}${tbl(['User','Role',''],S.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td><select aria-label="Role" onchange="setRole(${i},this.value)">${opt(['staff','admin'],u.role)}</select></td><td><button type="button" onclick="resetPw(${i})">Reset password</button> ${u.name==S.me?'':`<button type="button" onclick="delU(${i})">Delete</button>`}</td></tr>`))}`};
function frm0(){return `<form onsubmit="return addU(this)">${[['User name','name'],['Password (min 8 characters)','pw','password'],['Role','role','sel',['staff','admin']]].map(fld).join('')}<div><label>&nbsp;</label><button class="p">Add user</button></div></form>`}
function addPO(f){const d=Object.fromEntries(new FormData(f)),t=+d.total,pcn=+d.pct||50,dp=t*pcn/100;S.po.push({p:S.proj,no:d.no,sup:d.sup,desc:d.desc,total:t,paid:dp,del:'Awaiting delivery',date:d.date});S.ex.push({p:S.proj,date:d.date,sc:'General Requirements & Overhead',ct:'Hardware / General Materials',sup:d.sup,desc:'PO '+d.no+' down payment ('+pcn+'%)',qty:'',unit:'',amt:dp,sf:d.sf,rec:d.sup,rno:'',type:'Original Contract'});save();draw();return false}
function poDel(i,v){S.po[i].del=v;save();draw()}
function poPay(i){const o=S.po[i],b=o.total-o.paid;if(b<=0)return;const sf=prompt('Source of funds: BDO, BPI or Petty Cash','BDO');if(!SF.includes(sf)){alert('Use BDO, BPI or Petty Cash.');return}S.ex.push({p:o.p,date:today(),sc:'General Requirements & Overhead',ct:'Hardware / General Materials',sup:o.sup,desc:'PO '+o.no+' final payment',qty:'',unit:'',amt:b,sf:sf,rec:o.sup,rno:'',type:'Original Contract'});o.paid=o.total;save();draw()}
V.po=()=>`<h2>Purchase Orders</h2>${sel()}<p class="mut">The down payment (default 50%) posts to Expenses right away. Delivery is tracked separately. The final payment posts to Expenses when you record it, linked to the same PO.</p><form onsubmit="return addPO(this)">${[['PO No.','no'],['Supplier / Hardware','sup','text',null,'list="suplist"'],['Items','desc'],['PO total','total','number'],['Down payment % (blank = 50)','pct','num0'],['Source of funds','sf','sel',SF],['Date','date','date']].map(fld).join('')}<div><label>&nbsp;</label><button class="p">Create PO</button></div></form>${tbl(['Date','PO','Supplier','Items','Total','Paid','Balance','Delivery',''],pk('po').map(o=>{const i=S.po.indexOf(o),b=o.total-o.paid;return`<tr><td>${o.date}</td><td>${esc(o.no)}</td><td>${esc(o.sup)}</td><td>${esc(o.desc)}</td><td class="r">${$(o.total)}</td><td class="r">${$(o.paid)}</td><td class="r ${b>0&&o.del=='Delivered'?'red':''}">${$(b)}</td><td><select aria-label="Delivery" onchange="poDel(${i},this.value)">${opt(['Awaiting delivery','Delivered'],o.del)}</select></td><td>${b>0?`<button type="button" onclick="poPay(${i})">Final payment</button>`:'<span class="ok">Paid</span>'}</td></tr>`}))}`;
function viewR(i){const d=document.createElement('div');d.className='ov';d.setAttribute('role','dialog');d.innerHTML='<div class="ovbar"><button type="button" class="btn back">Back</button></div><img alt="Receipt" src="'+S.ex[i].img+'">';const close=()=>{d.remove();document.removeEventListener('keydown',onKey)};const onKey=e=>{if(e.key=='Escape')close()};d.querySelector('.back').onclick=close;d.onclick=e=>{if(e.target===d)close()};document.addEventListener('keydown',onKey);document.body.appendChild(d)}
function attach(i,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{S.ex[i].img=c.toDataURL('image/jpeg',0.6);localStorage.setItem('ccc',JSON.stringify(S))}catch(e){delete S.ex[i].img;alert('Browser storage is full. Receipt not saved.')}draw()};im.src=r.result};r.readAsDataURL(f)}
function addDx(f){if(S.role!='admin')return false;const d=Object.fromEntries(new FormData(f));S.dx.push({dp:d.dp,date:d.date,ct:d.ct,note:d.note,amt:+d.amt,sf:d.sf});save();draw();return false}
function addDpay(f){if(S.role!='admin')return false;S.dpay.push(Object.fromEntries(new FormData(f)));save();draw();return false}
const DXC=['Travel & site visits','Engineering consultants','Consumables & printing','Courier fees','Office supplies','Bookkeeping & accounting','Marketing & business development','Continuing education','Reimbursable / out-of-pocket'];
V.dop=()=>{if(S.role!='admin')return'';const N=S.dt.map(p=>p.n),m={};S.dx.forEach(x=>m[x.ct]=(m[x.ct]||0)+(+x.amt));let T=0;const pr=S.dpay.map(x=>{const g=x.days*x.rate+(+x.oh||0)*(+x.or||0);T+=g;return`<tr><td>${esc(x.name)}</td><td>${x.days}</td><td class="r">${$(x.rate)}</td><td>${x.oh||0}</td><td class="r">${$(g)}</td></tr>`});
  return `<h2>Design Operating Expenses & Payroll</h2><h3>Operating expenses</h3><form onsubmit="return addDx(this)">${[['Date','date','date'],['Design project','dp','sel',N],['Category','ct','sel',DXC],['Description','note'],['Amount','amt','number'],['Source of funds','sf','sel',SF]].map(fld).join('')}<div><label>&nbsp;</label><button class="p">Add</button></div></form>${tbl(['Date','Design project','Category','Description','Source','Amount'],S.dx.map(x=>`<tr><td>${x.date}</td><td>${esc(x.dp)}</td><td>${esc(x.ct)}</td><td>${esc(x.note)}</td><td>${x.sf}</td><td class="r">${$(x.amt)}</td></tr>`))}${tbl(['Category','Total'],Object.entries(m).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${$(v)}</td></tr>`))}<h3>In-house design staff payroll</h3><form onsubmit="return addDpay(this)">${[['Name','name'],['Days worked','days','number'],['Daily rate','rate','number'],['OT hours','oh','num0'],['OT rate per hour','or','num0']].map(fld).join('')}<div><label>&nbsp;</label><button class="p">Add</button></div></form>${tbl(['Name','Days','Daily rate','OT hrs','Gross pay'],pr)}<p><b>Total design payroll: ${$(T)}</b></p>`};
const AT=['ex','bill','leads','dt','dl','sm','rq','tk','py','iv','po','dx','dpay','vo','wr','at','tool','sub','sb','inc','sl','dis'];
const strip=o=>JSON.stringify(o,(k,v)=>k=='h'?undefined:k=='img'?'[receipt]':v);
const snap=()=>{const o={};AT.forEach(k=>o[k]=(S[k]||[]).map(strip));o.sc=Object.entries(S.sc).map(([k,v])=>k+'='+JSON.stringify(v));o.users=S.users.map(strip);return o};
const dif=(o,n)=>{try{const a=JSON.parse(o),b=JSON.parse(n),ks=Object.keys({...a,...b}).filter(k=>JSON.stringify(a[k])!=JSON.stringify(b[k]));return[ks.map(k=>k+': '+JSON.stringify(a[k])).join('; '),ks.map(k=>k+': '+JSON.stringify(b[k])).join('; ')]}catch(e){return[o,n]}};
function audit(b){if(!S.me)return;const a=snap(),t=new Date().toISOString().slice(0,16).replace('T',' ');Object.keys(a).forEach(k=>{const x=[...(b[k]||[])],y=[];a[k].forEach(v=>{const i=x.indexOf(v);i<0?y.push(v):x.splice(i,1)});const Lg=(act,o,n)=>S.al.push({t,u:S.me,tbl:k,act,o,n});if(x.length&&x.length==y.length)x.forEach((v,i)=>{const d=dif(v,y[i]);Lg('edit',d[0],d[1])});else{x.forEach(v=>Lg('delete',v,''));y.forEach(v=>Lg('create','',v))}});if(S.al.length>1000)S.al=S.al.slice(-1000);save()}
let LS=snap();const _draw=draw;draw=function(){try{audit(LS);LS=snap();_draw()}catch(e){showErr(e)}};
let AF={u:'',d:'',p:''};
V.audit=()=>{if(S.role!='admin')return'';const cut=s=>esc(String(s).slice(0,220));const L2=S.al.filter(x=>(!AF.u||x.u==AF.u)&&(!AF.d||x.t.slice(0,10)==AF.d)&&(AF.p===''||new RegExp('"p":'+AF.p+'[,}]').test(x.o+x.n))).slice(-200).reverse();
  return `<h2>Audit Log</h2><p class="mut">Every create, edit and delete is recorded with the old and new value. There is no way to edit or delete the log.</p><div class="grid" style="margin-bottom:12px"><div><label for="a_u">User</label><select id="a_u" onchange="AF.u=this.value;draw()"><option value="">All</option>${S.users.map(u=>`<option${u.name==AF.u?' selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div><label for="a_d">Date</label><input id="a_d" type="date" value="${AF.d}" onchange="AF.d=this.value;draw()"></div><div><label for="a_p">Project</label><select id="a_p" onchange="AF.p=this.value;draw()"><option value="">All</option>${P.map((n,i)=>`<option value="${i}"${AF.p!==''&&AF.p==i?' selected':''}>${esc(n)}</option>`).join('')}</select></div></div>${tbl(['Time','User','Table','Action','Old value','New value'],L2.map(x=>`<tr><td>${x.t}</td><td>${esc(x.u)}</td><td>${x.tbl}</td><td>${x.act}</td><td>${cut(x.o)}</td><td>${cut(x.n)}</td></tr>`))}`};
try{history.replaceState({t:S.tab,dp:S.dp,n:0},'')}catch(e){}
save();draw();idle();
</script></body></html>
